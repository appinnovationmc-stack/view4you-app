name: CheckVertical CI

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"

permissions:
  contents: read

concurrency:
  group: checkvertical-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Report dependency vulnerabilities
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const r=JSON.parse(require('fs').readFileSync('npm-audit.json','utf8')); console.log('AUDIT SUMMARY', JSON.stringify(r.metadata?.vulnerabilities || {})); for (const [name,v] of Object.entries(r.vulnerabilities || {})) { const via=(v.via||[]).map(x => typeof x === 'string' ? x : (x.title + ' [' + x.range + ']')).join('; '); console.log('AUDIT PACKAGE', name, 'severity=' + v.severity, 'range=' + v.range, 'fix=' + JSON.stringify(v.fixAvailable), 'via=' + via); } console.log('LOCK DIFF'); require('child_process').execSync('git diff -- package-lock.json', {stdio:'inherit'});"
      - name: Run automated tests
        run: npm test
      - name: Build customer app
        run: npm run build
      - name: Build admin console
        run: npm run build:admin
      - name: Build fleet portal
        run: npm run build:fleet
